# Password input
input-field {
    monitor =
    size = 320, 55
    outline_thickness = 2

    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true

    outer_color = rgba(122, 162, 247, 1.0)
    inner_color = rgba(36, 40, 59, 1.0)
    font_color = rgba(192, 202, 245, 1.0)

    fade_on_empty = false
    rounding = 12

    font_family = JetBrainsMono Nerd Font
    placeholder_text = <i>...</i>

    position = 0, -90
    halign = center
    valign = center
}
