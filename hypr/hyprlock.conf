
general {
    hide_cursor = true
    ignore_empty_input = false
    immediate_render = true
}

background {
    monitor =
    color = rgba(26, 27, 38, 1.0)
}

# Large centered clock
label {
    monitor =
    text = $TIME
    color = rgba(192, 202, 245, 1.0)
    font_size = 96
    font_family = JetBrainsMono Nerd Font
    position = 0, 100
    halign = center
    valign = center
}

