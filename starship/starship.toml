# Minimalist Tokyo Night Theme for Starship
add_newline = false

format = """
$directory\
$git_branch\
$git_status\
$cmd_duration\
$character"""

[directory]
style = "bold #7aa2f7"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
symbol = " "
style = "bold #bb9af7"
format = "[$symbol$branch]($style) "

[git_status]
style = "bold #e0af68"
format = "([$all_status$ahead_behind]($style) )"

[cmd_duration]
min_time = 2_000
style = "bold #e0af68"
format = "[$duration]($style) "

[character]
success_symbol = "[❯](bold #9ece6a)"
error_symbol = "[❯](bold #f7768e)"
vimcmd_symbol = "[❮](bold #7dcfff)"
